{% set name = "archspec" %}
{% set version = "0.2.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 87bd0f5664e641333c8878352987a7e7fadd225252279ac9f37c0ca185de3147

build:
  number: 0
  entry_points:
    - archspec = archspec.cli:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - poetry-core
  run:
    - python
    - python 3.6.15|,>=3.7.0,<4.0.0

test:
  imports:
    - archspec
    - archspec.cpu
  commands:
    - pip check
    - archspec --help
  requires:
    - pip

about:
  home: https://pypi.org/project/archspec
  summary: A library to query system architecture
  description: A library to query system architecture
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  dev_url: https://github.com/archspec/archspec
  doc_url: https://archspec.readthedocs.io

extra:
  recipe-maintainers:
    - anthchirp
    - isuruf
